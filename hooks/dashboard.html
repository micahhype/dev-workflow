<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow board</title>
<style>
  :root {
    --bg: #eef1f4; --surface: #ffffff; --ink: #1b2430; --muted: #6b7686; --line: #d5dbe3;
    --done: #2e9e6b; --wait: #e8a317; --todo: #cfd6df; --focus: #2f5fd0; --row-line: #e3e7ec;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a21; --surface: #1d242d; --ink: #e6eaf0; --muted: #8f9aab; --line: #2c3541;
      --done: #4cc28d; --wait: #f0b53a; --todo: #36404d; --focus: #7a9bff; --row-line: #2a323d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .page { max-width: 980px; margin: 0 auto; padding: 24px 20px 48px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; font-weight: 650; margin: 0; }
  .muted { color: var(--muted); }
  .error { color: var(--wait); }
  .live { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
  .dot.offline { background: var(--todo); }

  .track { display: flex; gap: 4px; }
  .segment { width: 26px; height: 8px; border-radius: 4px; background: var(--todo); flex: none; }
  .segment.done { background: var(--done); }
  .segment.waiting { background: var(--wait); }
  .segment.current { background: linear-gradient(90deg, var(--done) 50%, var(--todo) 50%); }

  .summary { margin: 6px 0 20px; color: var(--muted); }
  .summary b { color: var(--wait); font-weight: 600; }
  .grid { columns: 2 460px; column-gap: 20px; }
  .project { break-inside: avoid; background: var(--surface); border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
  .project-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 10px; min-width: 0; }
  .project-name { font-size: 16px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .waiting-count { color: var(--wait); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .progress-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .project-note { margin: 0; padding: 8px 16px 12px; border-top: 1px solid var(--row-line); }
  .feature-row { display: grid; grid-template-columns: 10px 1fr 84px 156px; gap: 10px; align-items: center;
                 padding: 8px 16px; border-top: 1px solid var(--row-line); cursor: pointer; }
  .feature-row:hover { background: var(--bg); }
  .feature-row.is-done { color: var(--muted); }
  .marker { width: 8px; height: 8px; border-radius: 50%; }
  .marker.waiting { background: var(--wait); }
  .feature-title, .status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { text-align: right; }
  .feature-row .track { width: 84px; gap: 3px; }
  .feature-row .segment { width: auto; flex: 1 1 0; max-width: 26px; height: 6px; border-radius: 3px; }
  .copy.resume { margin: 0; font-size: 12px; line-height: 1.4; padding: 0 10px; font-weight: 600;
                 color: var(--wait); border-color: var(--wait); }
  .done-toggle { display: block; width: 100%; text-align: left; padding: 8px 16px; border: 0;
                 border-top: 1px solid var(--row-line); background: none; color: var(--muted); font: inherit;
                 font-size: 13px; cursor: pointer; }
  .all-done { color: var(--muted); margin: 4px 0 20px; }
  .all-done-name { background: none; border: 0; padding: 0; font: inherit; color: var(--ink);
                   text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

  .scrim { position: fixed; inset: 0; background: rgb(10 14 20 / .35); }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface);
            display: flex; flex-direction: column; box-shadow: -4px 0 24px rgb(10 14 20 / .2);
            animation: slide-in 0.2s ease-out; }
  @keyframes slide-in { from { transform: translateX(100%); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
  .drawer-head { display: flex; justify-content: space-between; gap: 12px; padding: 18px 20px 8px; }
  .drawer-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .drawer-head p { margin: 2px 0 0; }
  .close { background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer;
           padding: 2px 6px; border-radius: 6px; }
  .tabs { display: flex; gap: 18px; padding: 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
         font: inherit; padding: 8px 0; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .drawer-body { padding: 16px 20px 32px; overflow-y: auto; flex: 1; }

  .mark-done:focus { outline: none; }
  .mark-done { border-top: 1px solid var(--line); padding: 14px 0 0; margin-top: 4px; }
  .mark-done-title { font-weight: 600; }
  .mark-done p { margin: 2px 0 8px; }
  .mark-done-actions { display: flex; gap: 8px; }
  .mark-done-report { margin: 4px 0 0; padding-left: 20px; }
  .action { font: inherit; font-size: 14px; padding: 3px 12px; cursor: pointer; color: var(--ink);
            border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .action:disabled { opacity: .6; cursor: default; }
  .warning { border-left: 4px solid var(--wait); background: var(--bg); padding: 8px 12px;
             border-radius: 6px; margin-bottom: 10px; }
  .phase { border-top: 1px solid var(--line); padding: 12px 0; }
  .phase:first-of-type { border-top: 0; }
  .phase-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; }
  .steps { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0; }
  .step { color: var(--muted); }
  .step.done { color: var(--done); }
  .step.waiting { color: var(--wait); font-weight: 600; }
  .review-map { margin: 8px 0; }
  .map-summary { font-weight: 600; margin: 0 0 4px; }
  .map-diff { margin: 0 0 6px; color: var(--muted); }
  .map-diff.over { color: var(--wait); font-weight: 600; }
  .map-group { margin: 6px 0; }
  .map-label { font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .map-group.must .map-label, .map-group.assume .map-label { color: var(--wait); }
  .map-entry { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 4px 0; overflow-wrap: anywhere; }
  .map-group.must .map-entry, .map-group.assume .map-entry { border-left-color: var(--wait); }
  .map-entry code { font-family: ui-monospace, monospace; font-size: 12.5px; }
  .excerpt { counter-reset: line var(--first-line); white-space: pre; overflow-x: auto; overflow-wrap: normal; }
  .excerpt span { display: block; }
  .excerpt span::before { counter-increment: line; content: counter(line); display: inline-block;
                          width: 4ch; margin-right: 12px; text-align: right; color: var(--muted); }
  details { margin-top: 4px; }
  summary { cursor: pointer; color: var(--muted); }
  .field-empty { color: var(--wait); font-weight: 600; }
  .notes dt { color: var(--muted); }
  .notes dd { margin: 0 0 6px; overflow-wrap: anywhere; }
  pre { background: var(--bg); border-radius: 6px; padding: 10px 12px; overflow: auto; font-size: 13px;
        white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 400; }
  code.command { font-family: ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere; }
  .drawer.wide { width: min(760px, 100%); }
  .doc { font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
  .doc h1, .doc h2, .doc h3, .doc h4 { font-weight: 600; margin: 18px 0 6px; }
  .doc h1 { font-size: 18px; }
  .doc h2 { font-size: 16px; }
  .doc h3, .doc h4 { font-size: 15px; }
  .doc > :first-child { margin-top: 0; }
  .doc p { margin: 0 0 10px; }
  .doc ul, .doc ol { margin: 0 0 10px; padding-left: 20px; }
  .doc li { margin: 2px 0; }
  .doc li > ul, .doc li > ol { margin: 0; }
  .doc code { font-family: ui-monospace, monospace; font-size: 12.5px; background: var(--bg);
              padding: 1px 5px; border-radius: 4px; }
  .doc pre code { padding: 0; background: none; }
  .doc .table-wrap { overflow-x: auto; margin: 0 0 10px; }
  .doc table { width: auto; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 6px 8px; overflow-wrap: break-word; }
  .doc th { color: var(--ink); font-weight: 600; }
  .doc blockquote { margin: 0 0 10px; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
  .copy { margin-left: 6px; font: inherit; font-size: 13px; padding: 0 8px; cursor: pointer; color: var(--ink);
          border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }

  @media (max-width: 560px) {
    .feature-row { grid-template-columns: 10px 1fr 84px; }
    .feature-row .status { grid-column: 2 / -1; text-align: left; }
  }
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <h1>Workflow board</h1>
    <span class="live"><span class="dot" id="dot"></span><span id="live">Connecting…</span></span>
  </header>
  <p class="summary" id="summary"></p>
  <div class="grid" id="projects"></div>
  <p class="all-done" id="all-done" hidden></p>
  <div class="grid" id="done-projects"></div>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <div><h2 id="drawer-title"></h2><p class="muted" id="drawer-subtitle"></p></div>
    <button class="close" id="close" aria-label="Close">×</button>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<script>
const POLL_MS = 2000;
const COPIED_MS = 1500;
// Mirror the state strings row_state() returns in dashboard.py.
const DONE_STATE = 'Done';
const NO_PHASES_STATE = 'No phases yet';
const TABS = ['Phases', 'Plan', 'Spec', 'Checkpoints', 'Config'];
const WIDE_TABS = ['Plan', 'Spec'];
const STEPS = [
  { label: 'Coded', ticks: ['coded'] },
  { label: 'Reviewed', ticks: ['code-reviewed', 'full code review'] },
  { label: 'Scanned', ticks: ['security-scanned', 'security-audit'] },
  { label: 'Approved', ticks: ['USER APPROVED'] },
];

let overviewText = null;
let overviewProjects = [];
let lastUpdateAt = null;
let isOffline = false;
let openFeature = null;
let drawerKey = null;
let selectedTab = 'Phases';
let opener = null;
let dashboardToken = null;
let shownDrawer = null;
let markDoneStatus = { stage: 'idle', lines: [], isError: false };
const expandedDone = new Set();

function el(tag, className, ...children) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  for (const child of children) {
    node.append(child instanceof Node ? child : String(child));
  }
  return node;
}

function isFailed(section) {
  return section !== null && typeof section === 'object' && !Array.isArray(section) && 'error' in section;
}

function unavailable(section) {
  return el('p', 'error', 'Unavailable: ' + section.error);
}

function phaseTrack(segments) {
  return el('div', 'track', ...segments.map((segment) => el('span', 'segment ' + segment)));
}

function makeActivatable(node, onActivate) {
  node.tabIndex = 0;
  node.setAttribute('role', 'button');
  node.addEventListener('click', () => onActivate(node));
  node.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      onActivate(node);
    }
  });
  return node;
}

async function fetchText(url) {
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error('HTTP ' + response.status);
  return response.text();
}

async function pollOverview() {
  try {
    const text = await fetchText('/api/overview');
    lastUpdateAt = Date.now();
    isOffline = false;
    if (text !== overviewText) {
      overviewText = text;
      const board = JSON.parse(text);
      overviewProjects = board.projects;
      dashboardToken = board.token;
      renderOverview();
    }
  } catch (error) {
    isOffline = true;
  }
  showAge();
}

function showAge() {
  const live = document.getElementById('live');
  document.getElementById('dot').classList.toggle('offline', isOffline);
  if (isOffline) {
    live.textContent = 'Offline, the server may have stopped';
    return;
  }
  if (lastUpdateAt === null) return;
  const seconds = Math.round((Date.now() - lastUpdateAt) / 1000);
  const noun = overviewProjects.length === 1 ? ' project' : ' projects';
  live.textContent = overviewProjects.length + noun + ', updated ' + seconds + 's ago';
}

function listedFeatures(project) {
  return isFailed(project.features) ? [] : project.features;
}

function renderOverview() {
  renderSummary();
  const activeProjects = overviewProjects.filter((project) => !isAllDone(project));
  const doneProjects = overviewProjects.filter(isAllDone);
  document.getElementById('projects').replaceChildren(...activeProjects.map(projectBlock));
  renderAllDone(doneProjects);
}

function isAllDone(project) {
  const features = listedFeatures(project);
  return features.length > 0 && features.every((feature) => feature.state === DONE_STATE);
}

function featureGroups(features) {
  const isDone = (feature) => feature.state === DONE_STATE;
  const hasNoPhases = (feature) => feature.state === NO_PHASES_STATE;
  return {
    waiting: features.filter((feature) => feature.waiting),
    inProgress: features.filter((feature) => !feature.waiting && !isDone(feature) && !hasNoPhases(feature)),
    noPhases: features.filter(hasNoPhases),
    done: features.filter(isDone),
  };
}

function renderSummary() {
  const summary = document.getElementById('summary');
  const waitingFeatures = overviewProjects.flatMap((project) => listedFeatures(project).filter((f) => f.waiting));
  if (waitingFeatures.length === 0) {
    summary.replaceChildren('Nothing waits for your approval.');
    return;
  }
  const waitingProjects = overviewProjects.filter((project) => listedFeatures(project).some((f) => f.waiting));
  const features = waitingFeatures.length === 1 ? ' feature waits' : ' features wait';
  const projects = waitingProjects.length === 1 ? ' project' : ' projects';
  summary.replaceChildren(el('b', '', waitingFeatures.length + features + ' for your approval'),
    ' in ' + waitingProjects.length + projects);
}

function projectBlock(project) {
  const block = el('section', 'project', projectHeader(project));
  if (isFailed(project.features)) {
    block.append(el('div', 'project-note', unavailable(project.features)));
    return block;
  }
  if (project.features.length === 0) {
    block.append(el('p', 'project-note muted', 'No features yet'));
    return block;
  }
  const groups = featureGroups(project.features);
  const openFeatures = [...groups.waiting, ...groups.inProgress, ...groups.noPhases];
  block.append(...openFeatures.map((feature) => featureRow(project, feature)));
  if (groups.done.length > 0) block.append(...doneList(project, groups.done));
  return block;
}

function projectHeader(project) {
  const name = el('span', 'project-name', project.name);
  name.title = project.root;
  const header = el('div', 'project-head', name);
  const groups = featureGroups(listedFeatures(project));
  if (groups.waiting.length > 0) {
    header.append(el('span', 'waiting-count', groups.waiting.length + ' waiting'));
  }
  if (groups.inProgress.length > 0) {
    header.append(el('span', 'progress-count', groups.inProgress.length + ' in progress'));
  } else if (groups.waiting.length === 0 && groups.noPhases.length > 0) {
    header.append(el('span', 'progress-count', 'no phases yet'));
  }
  return header;
}

function featureRow(project, feature) {
  const marker = el('span', feature.waiting ? 'marker waiting' : 'marker');
  const title = el('span', 'feature-title', feature.title);
  title.title = feature.title;
  const status = el('span', 'status', feature.waiting ? resumeButton(project.resume) : feature.state);
  status.title = feature.state;
  const rowClass = feature.state === DONE_STATE ? 'feature-row is-done' : 'feature-row';
  const row = el('div', rowClass, marker, title, phaseTrack(feature.track), status);
  return makeActivatable(row, (node) => openDrawer(project, feature, node));
}

function resumeButton(resumeCommand) {
  const button = copyButton(resumeCommand, 'Resume');
  button.classList.add('resume');
  button.setAttribute('aria-label', 'Resume session — needs approval');
  button.addEventListener('keydown', (event) => event.stopPropagation());
  button.addEventListener('click', (event) => event.stopPropagation());
  return button;
}

function doneList(project, doneFeatures) {
  const isExpanded = expandedDone.has(project.root);
  const toggle = el('button', 'done-toggle', doneFeatures.length + ' done');
  toggle.setAttribute('aria-expanded', String(isExpanded));
  toggle.addEventListener('click', () => toggleDone(project.root, 'done-toggle'));
  toggle.dataset.root = project.root;
  const rows = isExpanded ? doneFeatures.map((feature) => featureRow(project, feature)) : [];
  return [toggle, ...rows];
}

function renderAllDone(doneProjects) {
  const line = document.getElementById('all-done');
  line.hidden = doneProjects.length === 0;
  const names = doneProjects.map((project) => {
    const button = el('button', 'all-done-name', project.name);
    button.title = project.root;
    button.dataset.root = project.root;
    button.setAttribute('aria-expanded', String(expandedDone.has(project.root)));
    button.addEventListener('click', () => toggleDone(project.root, 'all-done-name'));
    return button;
  });
  const separatedNames = names.flatMap((name, index) => (index === 0 ? [name] : [', ', name]));
  line.replaceChildren('All done: ', ...separatedNames);
  const expanded = doneProjects.filter((project) => expandedDone.has(project.root));
  document.getElementById('done-projects').replaceChildren(...expanded.map(doneProjectBlock));
}

function doneProjectBlock(project) {
  const rows = project.features.map((feature) => featureRow(project, feature));
  return el('section', 'project', projectHeader(project), ...rows);
}

function toggleDone(root, buttonClass) {
  if (expandedDone.has(root)) {
    expandedDone.delete(root);
  } else {
    expandedDone.add(root);
  }
  renderOverview();
  const buttons = [...document.getElementsByClassName(buttonClass)];
  const sameButton = buttons.find((button) => button.dataset.root === root);
  if (sameButton) sameButton.focus();
}

function openDrawer(project, feature, node) {
  opener = node;
  openFeature = { root: project.root, name: project.name, slug: feature.slug };
  drawerKey = null;
  selectedTab = 'Phases';
  markDoneStatus = { stage: 'idle', lines: [], isError: false };
  document.getElementById('drawer').classList.remove('wide');
  document.getElementById('drawer-title').textContent = feature.title;
  document.getElementById('drawer-subtitle').textContent = project.name;
  document.getElementById('drawer-body').replaceChildren(el('p', 'muted', 'Loading…'));
  document.getElementById('scrim').hidden = false;
  document.getElementById('drawer').hidden = false;
  document.getElementById('close').focus();
  pollDetail();
}

function closeDrawer() {
  openFeature = null;
  document.getElementById('scrim').hidden = true;
  document.getElementById('drawer').hidden = true;
  if (opener && opener.isConnected) opener.focus();
}

function openOverviewFeature() {
  const project = overviewProjects.find((p) => p.root === openFeature.root);
  return project && listedFeatures(project).find((f) => f.slug === openFeature.slug);
}

function currentTrack() {
  const feature = openOverviewFeature();
  return feature ? feature.track : [];
}

async function pollDetail() {
  if (!openFeature) return;
  const requested = openFeature;
  const query = '?project=' + encodeURIComponent(requested.root) + '&feature=' + encodeURIComponent(requested.slug);
  try {
    const text = await fetchText('/api/state' + query);
    if (openFeature !== requested) return;
    const track = currentTrack();
    const key = text + JSON.stringify(track);
    if (key !== drawerKey) {
      drawerKey = key;
      renderDrawer(JSON.parse(text), track);
    }
  } catch (error) {
    if (openFeature !== requested) return;
    drawerKey = null;
    document.getElementById('drawer-body').replaceChildren(unavailable({ error: error.message }));
  }
}

function renderDrawer(state, track) {
  const gate = isFailed(state.gate) ? 'unavailable' : state.gate;
  document.getElementById('drawer-title').textContent = state.title;
  document.getElementById('drawer-subtitle').textContent = openFeature.name + ', gate ' + gate;
  shownDrawer = { state, track };
  renderTabs(state, track);
}

function renderTabs(state, track) {
  const hadMarkDoneFocus = Boolean(document.activeElement && document.activeElement.closest('.mark-done'));
  const openDetails = new Set([...document.querySelectorAll('#drawer-body details[open]')].map((d) => d.dataset.key));
  const tabs = TABS.map((name) => {
    const tab = el('button', 'tab', name);
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', String(name === selectedTab));
    tab.addEventListener('click', () => {
      selectedTab = name;
      renderTabs(state, track);
      document.querySelector('#tabs [aria-selected="true"]').focus();
    });
    return tab;
  });
  document.getElementById('tabs').replaceChildren(...tabs);
  document.getElementById('drawer').classList.toggle('wide', WIDE_TABS.includes(selectedTab));
  const body = document.getElementById('drawer-body');
  body.replaceChildren(...tabContent(state, track));
  for (const details of body.querySelectorAll('details')) {
    details.open = openDetails.has(details.dataset.key);
  }
  if (hadMarkDoneFocus) focusMarkDone();
}

function tabContent(state, track) {
  if (selectedTab === 'Phases') return phasesTab(state, track);
  if (selectedTab === 'Plan') return [markdownDoc(state.plan || 'No plan.md yet.')];
  if (selectedTab === 'Spec') return [markdownDoc(state.spec || 'No spec.md yet.')];
  if (selectedTab === 'Checkpoints') return checkpointsTab(state);
  return [isFailed(state.config) ? unavailable(state.config) : el('pre', '', state.config)];
}

function phasesTab(state, track) {
  const warnings = isFailed(state.warnings) ? [unavailable(state.warnings)]
    : state.warnings.map((warning) => el('div', 'warning', warning));
  if (isFailed(state.phases)) return [...warnings, unavailable(state.phases)];
  if (state.phases.length === 0) return [...warnings, el('p', 'muted', 'No phases yet.')];
  const phaseBlocks = state.phases.map((phase, index) => phaseBlock(phase, track[index] || 'todo'));
  return [...warnings, ...phaseBlocks, ...markDoneBlock(state)];
}

function markDoneBlock(state) {
  const isDone = state.phases.every((phase) => phase.approved);
  const feature = openOverviewFeature();
  const hasNoPhases = feature && feature.state === NO_PHASES_STATE;
  const hasResult = markDoneStatus.lines.length > 0;
  if ((isDone || hasNoPhases) && !hasResult) return [];
  const block = el('div', 'mark-done', el('div', 'mark-done-title', 'Mark done'), ...markDoneControls());
  block.setAttribute('role', 'status');
  block.setAttribute('aria-live', 'polite');
  block.tabIndex = -1;
  return [block];
}

function markDoneControls() {
  if (markDoneStatus.lines.length > 0) {
    const lineClass = markDoneStatus.isError ? 'error' : '';
    const report = el('ul', 'mark-done-report', ...markDoneStatus.lines.map((line) => el('li', lineClass, line)));
    report.tabIndex = -1;
    return [report];
  }
  if (markDoneStatus.stage === 'idle') {
    return [el('p', 'muted', 'Already finished this feature? Tick every remaining phase as approved.'),
      actionButton('Mark done', () => setMarkDoneStage('confirming'))];
  }
  const isSending = markDoneStatus.stage === 'sending';
  const confirm = actionButton(isSending ? 'Marking…' : 'Confirm', sendMarkDone);
  const cancel = actionButton('Cancel', () => setMarkDoneStage('idle'));
  confirm.disabled = isSending;
  cancel.disabled = isSending;
  return [el('p', '', "Tick every remaining phase as approved? A session still working on this feature won't be told."),
    el('div', 'mark-done-actions', confirm, cancel)];
}

function actionButton(label, onClick) {
  const button = el('button', 'action', label);
  button.addEventListener('click', onClick);
  return button;
}

function setMarkDoneStage(stage) {
  markDoneStatus = { stage, lines: [], isError: false };
  redrawShownDrawer();
}

function redrawShownDrawer() {
  renderTabs(shownDrawer.state, shownDrawer.track);
  focusMarkDone();
}

function focusMarkDone() {
  const enabledButton = document.querySelector('.mark-done button:not(:disabled)');
  const target = enabledButton || document.querySelector('.mark-done-report') || document.querySelector('.mark-done');
  if (target) target.focus();
}

async function sendMarkDone() {
  const target = openFeature;
  setMarkDoneStage('sending');
  const result = await postMarkDone(target);
  if (openFeature !== target) return;
  markDoneStatus = { stage: 'done', lines: result.lines, isError: result.isError };
  redrawShownDrawer();
  pollOverview();
  pollDetail();
}

async function postMarkDone(target) {
  try {
    const response = await fetch('/api/mark-done', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Dashboard-Token': dashboardToken },
      body: JSON.stringify({ project: target.root, feature: target.slug }),
    });
    const result = await response.json();
    if (!response.ok) return { lines: [result.error], isError: true };
    return { lines: result.report, isError: false };
  } catch (error) {
    return { lines: [error.message], isError: true };
  }
}

function phaseBlock(phase, segment) {
  const block = el('div', 'phase',
    el('div', 'phase-title', el('span', '', phase.title), phaseTrack([segment])),
    phaseSteps(phase.status || '', segment));
  const map = reviewMap(phase);
  if (map && phase.current) block.append(map);
  else if (map) block.append(detailsBlock(phase.title + ':map', 'Review map', map));
  block.append(detailsBlock(phase.title + ':evidence', 'Evidence', evidenceContent(phase)));
  const notes = el('dl', 'notes',
    el('dt', '', 'Review rounds'), el('dd', '', markdownDoc(phase.review_rounds ?? 'Not recorded')),
    el('dt', '', 'Unresolved'), el('dd', '', markdownDoc(phase.unresolved ?? 'Not recorded')));
  block.append(detailsBlock(phase.title + ':notes', 'Review notes', notes));
  return block;
}

function phaseSteps(statusLine, segment) {
  const steps = el('div', 'steps');
  for (const step of STEPS) {
    const present = step.ticks.filter((tick) => statusLine.includes(tick));
    if (present.length === 0) continue;
    const isTicked = present.some((tick) => statusLine.includes('[x] ' + tick) || statusLine.includes('[X] ' + tick));
    if (step.label === 'Approved' && !isTicked && segment === 'waiting') {
      steps.append(el('span', 'step waiting', 'Waiting for your approval'));
      continue;
    }
    steps.append(el('span', isTicked ? 'step done' : 'step', (isTicked ? '✓ ' : '') + step.label));
  }
  return steps;
}

const MAP_TIERS = [
  { tier: 'MUST', label: 'Must read', className: 'must' },
  { tier: 'ASSUME', label: 'Assumptions the spec did not make', className: 'assume' },
  { tier: 'SKIM', label: 'Skim', className: 'skim' },
  { tier: 'SKIP', label: 'Skip', className: 'skip' },
];

function reviewMap(phase) {
  const map = phase.review_map;
  if (!map || (map.entries.length === 0 && !phase.diff)) return null;
  const block = el('div', 'review-map');
  if (map.summary) block.append(el('p', 'map-summary', map.summary));
  if (phase.diff) block.append(diffLine(phase.diff));
  if (phase.over_budget && !phase.over_budget.startsWith('<')) {
    block.append(el('div', 'warning', 'Over budget: ' + phase.over_budget));
  }
  for (const { tier, label, className } of MAP_TIERS) {
    const entries = map.entries.filter((entry) => entry.tier === tier);
    if (entries.length === 0) continue;
    const group = el('div', 'map-group ' + className, el('div', 'map-label', label + ' (' + entries.length + ')'));
    for (const [index, entry] of entries.entries()) group.append(mapEntry(phase, entry, tier + index));
    block.append(tier === 'SKIP' ? detailsBlock(phase.title + ':skip', 'Skip (' + entries.length + ')', group) : group);
  }
  return block;
}

function diffLine(diff) {
  const isOver = diff.lines !== null && diff.limit !== null && diff.lines > diff.limit;
  const measured = diff.lines === null ? 'not measured yet' : diff.lines + ' lines changed';
  const budget = diff.estimate === null ? '' : ' · plan budget ~' + diff.estimate + ' (limit ' + diff.limit + ')';
  return el('p', isOver ? 'map-diff over' : 'map-diff', 'Diff: ' + measured + budget);
}

function mapEntry(phase, entry, key) {
  const item = el('div', 'map-entry');
  if (entry.path) {
    const range = entry.start === null ? '' : ':' + entry.start + (entry.end !== entry.start ? '-' + entry.end : '');
    item.append(el('code', '', entry.path + range), ' ');
  }
  item.append(...inline(entry.text));
  if (entry.excerpt && entry.excerpt.lines.length > 0) {
    const code = el('pre', 'excerpt', ...entry.excerpt.lines.map((line) => el('span', '', line)));
    code.style.setProperty('--first-line', String(entry.excerpt.first - 1));
    item.append(detailsBlock(phase.title + ':' + key, 'Show code', code));
  }
  return item;
}

function evidenceContent(phase) {
  if (phase.evidence_empty) return el('p', 'field-empty', 'Empty: no cited proof yet.');
  return markdownDoc(phase.evidence);
}

function detailsBlock(key, label, content) {
  const details = el('details', '', el('summary', '', label), content);
  details.dataset.key = key;
  return details;
}

const HEADING = /^(#{1,4})\s+(.*)$/;
const FENCE = /^\s*```/;
const LIST_ITEM = /^(\s*)([-*]|\d+\.)\s+(.*)$/;
const QUOTE = /^\s*>\s?(.*)$/;
const TABLE_SEPARATOR = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/;
const HTML_COMMENT = /<!--[\s\S]*?-->/g;
const INLINE = /`([^`]+)`|\*\*(\S(?:.*?\S)?)\*\*|(?<!\w)\*([^*\s](?:[^*]*[^*\s])?)\*(?!\w)|(?<!\w)_([^_\s](?:[^_]*[^_\s])?)_(?!\w)/g;
const NESTED_INDENT = 2;

function markdownDoc(text) {
  return el('div', 'doc', renderMarkdown(text));
}

function renderMarkdown(text) {
  const lines = text.replace(HTML_COMMENT, '').split(/\r?\n/);
  const fragment = document.createDocumentFragment();
  let index = 0;
  while (index < lines.length) {
    const block = readBlock(lines, index);
    if (block.node) fragment.append(block.node);
    index = block.next;
  }
  return fragment;
}

function readBlock(lines, start) {
  const line = lines[start];
  if (line.trim() === '') return { node: null, next: start + 1 };
  if (FENCE.test(line)) return readFence(lines, start);
  const heading = line.match(HEADING);
  if (heading) return { node: el('h' + heading[1].length, '', ...inline(heading[2])), next: start + 1 };
  if (isTableStart(lines, start)) return readTable(lines, start);
  if (QUOTE.test(line)) return readQuote(lines, start);
  if (LIST_ITEM.test(line)) return readList(lines, start);
  return readParagraph(lines, start);
}

function startsBlock(lines, index) {
  const line = lines[index];
  return line.trim() === '' || FENCE.test(line) || HEADING.test(line) || QUOTE.test(line)
    || LIST_ITEM.test(line) || isTableStart(lines, index);
}

function readParagraph(lines, start) {
  let end = start + 1;
  while (end < lines.length && !startsBlock(lines, end)) end += 1;
  const text = lines.slice(start, end).map((line) => line.trim()).join(' ');
  return { node: el('p', '', ...inline(text)), next: end };
}

function readFence(lines, start) {
  let end = start + 1;
  while (end < lines.length && !FENCE.test(lines[end])) end += 1;
  const code = lines.slice(start + 1, end).join('\n');
  return { node: el('pre', '', el('code', '', code)), next: end + 1 };
}

function readQuote(lines, start) {
  let end = start;
  while (end < lines.length && QUOTE.test(lines[end])) end += 1;
  const text = lines.slice(start, end).map((line) => line.match(QUOTE)[1].trim()).join(' ');
  return { node: el('blockquote', '', ...inline(text)), next: end };
}

function isTableStart(lines, index) {
  return lines[index].includes('|') && index + 1 < lines.length && TABLE_SEPARATOR.test(lines[index + 1]);
}

function readTable(lines, start) {
  let end = start + 2;
  while (end < lines.length && lines[end].includes('|') && lines[end].trim() !== '') end += 1;
  const head = el('thead', '', tableRow('th', tableCells(lines[start])));
  const bodyRows = lines.slice(start + 2, end).map((line) => tableRow('td', tableCells(line)));
  const table = el('table', '', head, el('tbody', '', ...bodyRows));
  return { node: el('div', 'table-wrap', table), next: end };
}

function tableCells(line) {
  const inner = line.trim().replace(/^\|/, '').replace(/\|$/, '');
  return inner.split('|').map((cell) => cell.trim());
}

function tableRow(cellTag, cells) {
  return el('tr', '', ...cells.map((cell) => el(cellTag, '', ...inline(cell))));
}

function readList(lines, start) {
  const items = [];
  let end = start;
  while (end < lines.length) {
    const item = lines[end].match(LIST_ITEM);
    const isContinuation = !item && items.length > 0 && /^\s+\S/.test(lines[end]);
    if (!item && !isContinuation) break;
    if (item && startsOtherList(items, item)) break;
    if (item) {
      items.push({ indent: item[1].length, isOrdered: /\d/.test(item[2]), number: parseInt(item[2], 10), text: item[3] });
    } else {
      items[items.length - 1].text += ' ' + lines[end].trim();
    }
    end += 1;
  }
  return { node: buildList(items), next: end };
}

function startsOtherList(items, item) {
  const isOrdered = /\d/.test(item[2]);
  return items.length > 0 && item[1].length <= items[0].indent && isOrdered !== items[0].isOrdered;
}

function buildList(items) {
  const rootList = listElement(items[0]);
  const openLists = [{ indent: items[0].indent, list: rootList }];
  for (const item of items) {
    listFor(openLists, item).append(el('li', '', ...inline(item.text)));
  }
  return rootList;
}

function listFor(openLists, item) {
  while (openLists.length > 1 && item.indent < openLists[openLists.length - 1].indent) openLists.pop();
  const innermost = openLists[openLists.length - 1];
  if (item.indent < innermost.indent + NESTED_INDENT) return innermost.list;
  const childList = listElement(item);
  (innermost.list.lastElementChild || innermost.list).append(childList);
  openLists.push({ indent: item.indent, list: childList });
  return childList;
}

function listElement(item) {
  if (!item.isOrdered) return el('ul', '');
  const list = el('ol', '');
  list.start = item.number;
  return list;
}

function inline(text) {
  const nodes = [];
  let consumed = 0;
  for (const match of text.matchAll(INLINE)) {
    nodes.push(text.slice(consumed, match.index), inlineNode(match));
    consumed = match.index + match[0].length;
  }
  nodes.push(text.slice(consumed));
  return nodes;
}

function inlineNode(match) {
  const [, code, bold, starItalic, underscoreItalic] = match;
  if (code !== undefined) return el('code', '', code);
  if (bold !== undefined) return el('strong', '', ...inline(bold));
  return el('em', '', starItalic ?? underscoreItalic);
}

function copyButton(text, label = 'Copy') {
  const button = el('button', 'copy', label);
  button.addEventListener('click', async () => {
    await navigator.clipboard.writeText(text);
    button.textContent = 'Copied';
    setTimeout(() => { button.textContent = label; }, COPIED_MS);
  });
  return button;
}

function command(text) {
  return el('span', '', el('code', 'command', text), copyButton(text));
}

function rollbackCell(rollbackCommand) {
  return rollbackCommand ? command(rollbackCommand) : '';
}

function checkpointsTab(state) {
  const content = [];
  if (isFailed(state.checkpoints)) {
    content.push(unavailable(state.checkpoints));
  } else if (state.checkpoints.length === 0) {
    content.push(el('p', 'muted', 'No checkpoints, or not a git repository.'));
  } else {
    const header = el('tr', '', el('th', '', 'Time'), el('th', '', 'Tool'), el('th', '', 'Roll back (run in your shell)'));
    const rows = state.checkpoints.map((row) => el('tr', '',
      el('td', '', row.timestamp ?? '?'), el('td', '', row.tool ?? '?'),
      el('td', '', rollbackCell(state.actions.rollback[row.ref]))));
    content.push(el('table', '', header, ...rows));
  }
  content.push(el('p', '', el('span', 'muted', 'Unlock the gate: '), command(state.actions.unlock_gate)));
  return content;
}

document.getElementById('close').addEventListener('click', closeDrawer);
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && openFeature) closeDrawer();
});

pollOverview();
setInterval(pollOverview, POLL_MS);
setInterval(pollDetail, POLL_MS);
setInterval(showAge, 1000);
</script>
</body>
</html>
