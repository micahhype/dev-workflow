<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 412" width="1000" height="412" role="img" aria-label="The dev-workflow feature line: clarify, research, design, plan, then build and review each phase, then a final audit and ship. Work stops at four gates until you approve.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .panel { fill: #0d1117; stroke: #30363d; }
    .line { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .think { stroke: #58a6ff; }
    .build { stroke: #bc8cff; }
    .ship { stroke: #3fb950; }
    .stop { fill: #0d1117; stroke-width: 4; }
    .name { fill: #e6edf3; font-size: 17px; font-weight: 600; }
    .note { fill: #9198a1; font-size: 13px; }
    .agent { fill: #9198a1; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .gate { fill: #e3b341; }
    .you { fill: #1f2328; font-size: 13px; font-weight: 700; }
    .done { fill: #3fb950; }
    .tick { fill: none; stroke: #0d1117; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect class="panel" x="0.5" y="0.5" width="999" height="411" rx="14"/>

  <!-- before any code -->
  <path class="line think" d="M100,92 H870"/>
  <!-- phase by phase: round the bend, then the loop back to Build -->
  <path class="line build" d="M870,92 H938 a24,24 0 0 1 24,24 V266 a24,24 0 0 1 -24,24 H416"/>
  <path class="line build" d="M416,290 a20,20 0 0 1 -20,-20 V246 a20,20 0 0 1 20,-20 H864 a20,20 0 0 1 20,20 V270 a20,20 0 0 1 -20,20"/>
  <text class="note" x="640" y="214">next phase</text>
  <text class="note" style="text-anchor:start" x="64" y="214">Amber stops are yours.</text>
  <text class="note" style="text-anchor:start" x="64" y="233">Nothing moves on until you approve.</text>
  <!-- wrap up -->
  <path class="line ship" d="M416,290 H80"/>
  <!-- direction of travel -->
  <path class="line think" d="M191,85 l7,7 l-7,7"/>
  <path class="line think" d="M381,85 l7,7 l-7,7"/>
  <path class="line build" d="M955,187 l7,7 l7,-7"/>
  <path class="line build" d="M709,283 l-7,7 l7,7"/>
  <path class="line build" d="M636,219 l7,7 l-7,7"/>
  <path class="line ship" d="M269,283 l-7,7 l7,7"/>
  <!-- stops, each with the agent that does the work -->
  <circle class="stop think" cx="100" cy="92" r="8"/>
  <text class="name" x="100" y="128">Clarify</text>
  <text class="note" x="100" y="147">what done means</text>
  <text class="agent" x="100" y="165">orchestrator</text>
  <circle class="stop think" cx="290" cy="92" r="8"/>
  <text class="name" x="290" y="128">Research</text>
  <text class="note" x="290" y="147">domain + codebase</text>
  <text class="agent" x="290" y="165">domain-researcher</text>
  <circle class="stop think" cx="480" cy="92" r="8"/>
  <text class="name" x="480" y="128">Design</text>
  <text class="note" x="480" y="147">one option that fits</text>
  <text class="agent" x="480" y="165">solution-architect</text>
  <circle class="stop think" cx="740" cy="92" r="8"/>
  <text class="name" x="740" y="128">Plan</text>
  <text class="note" x="740" y="147">small phases</text>
  <text class="agent" x="740" y="165">plan-reviewer</text>
  <circle class="stop build" cx="800" cy="290" r="8"/>
  <text class="name" x="800" y="326">Build</text>
  <text class="note" x="800" y="345">one phase</text>
  <text class="agent" x="800" y="363">coder</text>
  <circle class="stop build" cx="610" cy="290" r="8"/>
  <text class="name" x="610" y="326">Review</text>
  <text class="note" x="610" y="345">code + security</text>
  <text class="agent" x="610" y="363">code-reviewer</text>
  <circle class="stop ship" cx="330" cy="290" r="8"/>
  <text class="name" x="330" y="326">Audit</text>
  <text class="note" x="330" y="345">the whole feature</text>
  <text class="agent" x="330" y="363">security-audit</text>
  <!-- gates: work stops here until you say so -->
  <rect class="gate" x="579" y="78" width="82" height="28" rx="14"/>
  <text class="you" x="620" y="96.5">you pick</text>
  <rect class="gate" x="817" y="78" width="106" height="28" rx="14"/>
  <text class="you" x="870" y="96.5">you approve</text>
  <rect class="gate" x="427" y="276" width="106" height="28" rx="14"/>
  <text class="you" x="480" y="294.5">you approve</text>
  <rect class="gate" x="147" y="276" width="106" height="28" rx="14"/>
  <text class="you" x="200" y="294.5">you approve</text>
  <!-- shipped -->
  <circle class="done" cx="80" cy="290" r="15"/>
  <path class="tick" d="M73,290 l5,5 l9,-10"/>
  <text class="name" x="80" y="326">Ship</text>
</svg>
